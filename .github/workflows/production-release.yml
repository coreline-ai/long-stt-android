name: Production release bundle

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: "Operator-only release reference (not embedded in the artifact)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build-signed-bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      LONG_STT_RELEASE_STORE_FILE: ${{ runner.temp }}/coreline-upload.jks
      LONG_STT_RELEASE_STORE_PASSWORD: ${{ secrets.LONG_STT_RELEASE_STORE_PASSWORD }}
      LONG_STT_RELEASE_KEY_ALIAS: ${{ secrets.LONG_STT_RELEASE_KEY_ALIAS }}
      LONG_STT_RELEASE_KEY_PASSWORD: ${{ secrets.LONG_STT_RELEASE_KEY_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}

    steps:
      - name: Check out the approved source revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build requirements
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Materialize upload keystore in ephemeral runner storage
        env:
          LONG_STT_RELEASE_STORE_BASE64: ${{ secrets.LONG_STT_RELEASE_STORE_BASE64 }}
        run: |
          test -n "$LONG_STT_RELEASE_STORE_BASE64"
          printf '%s' "$LONG_STT_RELEASE_STORE_BASE64" | base64 --decode > "$LONG_STT_RELEASE_STORE_FILE"
          test -s "$LONG_STT_RELEASE_STORE_FILE"
          chmod 600 "$LONG_STT_RELEASE_STORE_FILE"

      - name: Prepare locked whisper.cpp source
        run: ./scripts/setup_whisper.sh

      - name: Build and verify signed production bundle
        run: ./gradlew --no-daemon :app:productionReleaseBundle

      - name: Upload signed artifact and provenance
        uses: actions/upload-artifact@v4
        with:
          name: long-stt-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/security/release-provenance.json
